name: Release

# 推 v* 标签时编译 macOS / Windows 两个平台的 TDLib，打成 tar.gz 挂到同名 Release。
# 下游（TGDirector）按标签直接下载，不再每次现编。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TD_PREFIX: C:/td-prefix
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            gperf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: 编译并安装
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          # GCC >= 15 默认 C23，自带 tl-parser 的 K&R 风格 getopt 声明会编译失败，钉回 gnu11
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-std=gnu11" -DCMAKE_INSTALL_PREFIX="$TD_PREFIX" ..
          cmake --build . --target install

      # 把 libtdjson.dll 的 MinGW 运行时依赖（openssl/zlib/libstdc++ 等）一并收进 bin/，
      # 下游不必再装这些包，也避免与编译时的版本错位
      - name: 收集运行时 DLL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BIN="$(cygpath -u "$TD_PREFIX")/bin"
          copy_deps() {
            objdump -p "$1" | awk '/DLL Name/{print $3}' | while read -r dll; do
              if [ -f "/mingw64/bin/$dll" ] && [ ! -f "$BIN/$dll" ]; then
                cp "/mingw64/bin/$dll" "$BIN/"
                copy_deps "/mingw64/bin/$dll"
              fi
            done
          }
          copy_deps "$BIN/libtdjson.dll"
          ls -la "$BIN"

      - name: 打包
        shell: bash
        run: tar -czf tdlib-windows-x64.tar.gz -C "$TD_PREFIX" .

      - uses: actions/upload-artifact@v4
        with:
          name: tdlib-windows-x64
          path: tdlib-windows-x64.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: brew install gperf openssl@3

      # libtdjson 按绝对路径链 /opt/homebrew/opt/openssl@3，与本地构建一致；
      # TGDirector 的 bundle-dylibs.sh 打 .app 时会把 libssl/libcrypto 收进去改成 @rpath
      - name: 编译并安装
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCMAKE_INSTALL_PREFIX="$PWD/../tdlib" ..
          # ponytail: 标准 runner 只有 7GB 内存，TDLib 单个编译单元吃 2GB+，并发压到 3；换大 runner 可去掉
          cmake --build . --target install --parallel 3

      - name: 打包
        run: tar -czf tdlib-macos-arm64.tar.gz -C tdlib .

      - uses: actions/upload-artifact@v4
        with:
          name: tdlib-macos-arm64
          path: tdlib-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" tdlib-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "commit ${GITHUB_SHA}"
